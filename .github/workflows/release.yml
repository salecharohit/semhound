name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.1.3)'
        required: false
        default: ''

jobs:
  release:
    name: Version bump and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/semhound
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
      contents: write   # push version bump commit and tag
    env:
      SEMANTIC_RELEASE_VERSION: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for version calculation
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v9.8.1
        with:
          github_token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Debug release output
        run: echo "released: ${{ steps.semrel.outputs.released }}"

      - name: Install build tools
        if: steps.semrel.outputs.released == 'true'
        run: pip install build

      - name: Syntax check
        if: steps.semrel.outputs.released == 'true'
        run: python -m compileall src/semhound -q

      - name: Build wheel and sdist
        if: steps.semrel.outputs.released == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.semrel.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
