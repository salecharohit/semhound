name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install tqdm pyyaml anthropic google-generativeai openai boto3

      - name: Syntax check
        run: python -m compileall src/semhound -q

      - name: Check imports
        run: PYTHONPATH=src python -c "import semhound"
